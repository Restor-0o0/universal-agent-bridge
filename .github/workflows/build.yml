name: Build and package
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, Android and JVM builds
        shell: bash
        run: sh ./gradlew :protocol:jvmTest :domain:jvmTest :client-core:jvmTest :host-engine:test :relay-engine:test :codex-adapter:test :androidApp:assembleDebug :desktopApp:classes :relayHeadless:installDist :hostApp:installDist --stacktrace
      - name: Package Windows, Android and USB Host bundle
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\build-release.ps1 -SkipLinux
      - name: Package Linux DEB
        if: runner.os == 'Linux'
        shell: bash
        run: ./gradlew :desktopApp:packageDeb
      - name: Upload Windows and Android packages
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: agent-bridge-windows-android
          compression-level: 0
          path: dist/*
      - name: Upload Linux package
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: agent-bridge-linux
          compression-level: 0
          path: apps/desktop/build/compose/binaries/main/deb/*.deb
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: agent-bridge-*
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/* --verify-tag --generate-notes
